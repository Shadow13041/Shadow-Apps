<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>New Tab</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;padding:34px 20px}
main{width:100%;max-width:560px;margin:0 auto}
form{display:flex;align-items:center;gap:10px;padding:7px 15px;background:#191919;border:1px solid #303030;border-radius:18px}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:12px 0;font-size:15px}
button{border:0;background:transparent;color:#fff;font-size:20px;padding:6px}
h2{font-size:12px;font-weight:500;color:#999;margin:30px 0 13px}
.links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:90px;border:1px solid #292929;border-radius:16px;background:#171717;color:#eee;text-decoration:none;font-size:12px}
a:active{background:#303030}
.symbol{font-size:23px;font-weight:600}
@media(max-width:380px){.links{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<form action="https://www.google.com/search" method="get">
<input name="q" type="search" placeholder="Suchen oder Adresse eingeben" aria-label="Suchbegriff">
<button type="submit" aria-label="Suchen">⌕</button>
</form>
<h2>SCHNELLZUGRIFFE</h2>
<div class="links">
<a href="https://www.google.com/"><span class="symbol">G</span>Google</a>
<a href="https://www.youtube.com/"><span class="symbol">▶</span>YouTube</a>
<a href="https://www.wikipedia.org/"><span class="symbol">W</span>Wikipedia</a>
<a href="https://github.com/"><span class="symbol">⌘</span>GitHub</a>
</div>
</main>
</body>
</html>
